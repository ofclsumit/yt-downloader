<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>TrimPoint — Precision Online Video Clipper &amp; Timestamp Cutter</title>
    <meta
      name="description"
      content="Create custom video clips by choosing an exact start and end time. Preview your selection, choose your preferred quality, and create your clip online in seconds."
    />
    <meta name="theme-color" content="#070b14" />
    <link rel="canonical" href="https://trimpoint.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trimpoint.app/" />
    <meta property="og:title" content="TrimPoint — Precision Online Video Clipper &amp; Timestamp Cutter" />
    <meta
      property="og:description"
      content="Create the exact video clip you need. Pick start and end timestamps, choose high-definition quality, and extract your clip online."
    />
    <meta property="og:site_name" content="TrimPoint" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrimPoint — Precision Online Video Clipper &amp; Timestamp Cutter" />
    <meta
      name="twitter:description"
      content="Create the exact video clip you need. Pick start and end timestamps, choose high-definition quality, and extract your clip online."
    />

    <!-- Google Fonts Preconnect & Inter / JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (Schema.org WebApplication & Organization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TrimPoint",
        "url": "https://trimpoint.app/",
        "description": "Create custom video clips by choosing an exact start and end time. Preview your selection, choose your preferred quality, and create your clip online in seconds.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
